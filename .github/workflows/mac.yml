name: App Mac
on:
  pull_request:
    paths: ["mac/**", "extension/**", ".github/workflows/mac.yml"]
  push:
    branches: [main]
    paths: ["mac/**", "extension/**", ".github/workflows/mac.yml"]
  workflow_dispatch:
jobs:
  construire:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fabriquer RetroRevente.app
        run: BUILD=${{ github.run_number }} sh mac/construire.sh
      - name: Vérifier l'app
        run: |
          lipo -info mac/build/RetroRevente.app/Contents/MacOS/RetroRevente
          codesign -dv mac/build/RetroRevente.app 2>&1 | head -5
      - name: Lancer l'app et prendre une capture
        continue-on-error: true
        run: |
          open mac/build/RetroRevente.app
          sleep 25
          pgrep -x RetroRevente
          screencapture -x mac/build/capture.png
          osascript -e 'tell application "RetroRevente" to quit' || true
      - uses: actions/upload-artifact@v4
        with:
          name: RetroRevente-mac
          path: |
            mac/build/RetroRevente-mac.zip
            mac/build/capture.png
          if-no-files-found: warn
